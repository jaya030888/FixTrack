services:
  herhack-postgis:
    image: postgis/postgis:16-3.4
    container_name: herhack-postgis
    restart: always
    environment:
      POSTGRES_DB: herhack_db
      POSTGRES_USER: herhack_user
      POSTGRES_PASSWORD: herhack_password
    ports:
      - "5433:5432"  # Mapped to 5433 to avoid collision with local PostgreSQL service
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgis_data:
